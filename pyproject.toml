[project]
name = "atlas-plugin"
version = "0.2.0"            # keep in lockstep with protoagent.plugin.yaml (a test enforces it)
description = "Atlas — drill-down LikeC4 architecture diagrams you can explore and present, as a protoAgent plugin."
requires-python = ">=3.11"

# No runtime pip deps: the host provides fastapi + langchain-core, and the layout engine is a
# vendored single-file Node bundle (vendor/atlas-engine.mjs) run with Node >= 20.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web", "static", "vendor", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
