<style id="atlas-css">* { box-sizing: border-box }
html, body, #root { margin: 0; height: 100%; overflow: hidden }
body {
background: var(--pl-color-bg); color: var(--pl-color-fg);
font-family: var(--pl-font-sans); font-size: var(--pl-font-size-sm); line-height: 1.45;

@media (max-width: 640px) {

background: var(--a-raised); position: relative }
.d-body { padding: var(--pl-space-2) var(--pl-space-4) var(--pl-space-5) }

}
.callout { position: absolute; z-index: 12; max-width: min(320px, calc(100% - 16px)); padding: var(--pl-space-2) 28px var(--pl-space-2) var(--pl-space-3);

<script>

    var s = document.createElement("script");
    s.type = "module"; s.src = BASE + "/plugins/atlas/static/assets/atlas-KXAjFzod.js";

    document.head.appendChild(s);
  })();
